name: refresh-data

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**", "data/static/**"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/fetch.py

      - name: Fetch AI Price Index (CC BY 4.0, RoninForge)
        run: git clone --depth 1 https://github.com/RoninForge/ai-price-index.git "$RUNNER_TEMP/ai-price-index" || echo "price index unavailable"

      - name: Build dashboard data
        env:
          PRICE_INDEX_DIR: ${{ runner.temp }}/ai-price-index
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data dist
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
